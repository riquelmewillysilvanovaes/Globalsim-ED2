<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GlobalSIM{% endblock %}</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

  <!-- Navbar Clara e Moderna -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <i class="bi bi-globe-americas me-2" style="color: var(--primary-color);"></i>Global<span>SIM</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-3 align-items-start align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('index') }}">Início</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('listar_paises') }}">Países</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('cobertura') }}">Consultar Cobertura</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('exibir_metricas') }}">Métricas</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-outline-primary px-4 ms-lg-2 text-start text-lg-center" href="{{ url_for('cadastrar_pais') }}">
              Cadastrar País
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Flash Messages -->
  <div class="container mt-4">
    {% include 'components/_alerts.html' %}
  </div>

  <!-- Main Content -->
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
